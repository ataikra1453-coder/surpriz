
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Küçük Bir Sürpriz 🌷</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;min-height:100vh;overflow-x:hidden;
 display:flex;justify-content:center;align-items:center;
 background:linear-gradient(135deg,#fff0f5,#eeeaff,#e8f8f1);
 font-family:'Trebuchet MS',sans-serif;color:#88758f;
 padding:20px;
}

.card{
 width:100%;max-width:470px;text-align:center;
 background:#ffffffbd;border:2px solid white;
 border-radius:30px;padding:30px 22px;
 box-shadow:0 15px 45px #bda7c755;
 position:relative;z-index:2;
}

h1{color:#bd8bb3;font-size:25px}
p{line-height:1.8}

.arena{
 height:245px;
 display:flex;
 align-items:center;
 justify-content:center;
 position:relative;
}

.envelope{
 width:155px;height:105px;background:#eab9d4;
 position:relative;border-radius:5px;cursor:pointer;
 box-shadow:0 9px 20px #cba5bf66;
 transition:transform 1.25s cubic-bezier(.22,.61,.36,1);
}

.envelope:before{
 content:"";position:absolute;inset:0;
 background:#f5cce0;
 clip-path:polygon(0 0,50% 57%,100% 0);
 z-index:3;transform-origin:top;
 transition:transform 1s;
}

.envelope:after{
 content:"♥";position:absolute;top:36px;left:65px;
 color:white;font-size:27px;z-index:4;
}

.envelope.open:before{
 transform:rotateX(180deg);z-index:0;
}

.envelope.open:after{opacity:0}

.paper{
 position:absolute;left:12px;top:10px;
 width:131px;height:85px;
 background:#fffaf0;border-radius:5px;
 transition:transform 1.1s;
}

.envelope.open .paper{
 transform:translateY(-75px);
}

.shake-right{transform:translate(105px,0) rotate(13deg)}
.shake-left{transform:translate(-105px,0) rotate(-13deg)}
.shake-up{transform:translate(0,-65px) rotate(9deg)}
.shake-down{transform:translate(0,65px) rotate(-9deg)}

button{
 border:0;border-radius:30px;padding:13px 23px;
 background:#e5b4d3;color:white;font-size:15px;
 cursor:pointer;margin:8px;transition:.25s;
}

button:hover{
 transform:scale(1.06);
 background:#d49ac1;
}

#message{
 line-height:1.9;
 margin-top:18px;
 min-height:70px;
}

.hidden{display:none!important}

.fade{animation:fade 1s ease}

@keyframes fade{
 from{opacity:0;transform:translateY(15px)}
 to{opacity:1;transform:translateY(0)}
}

.cat{
 font-size:85px;
 cursor:pointer;
 display:inline-block;
 animation:bounce 1.7s infinite ease-in-out;
}

@keyframes bounce{
 50%{transform:translateY(-14px) rotate(8deg)}
}

.floating{
 position:fixed;top:-30px;
 pointer-events:none;
 animation:fall 6s linear forwards;
 z-index:1;
}

@keyframes fall{
 to{transform:translateY(110vh) rotate(360deg);opacity:0}
}
</style>
</head>

<body>

<div class="card">

 <h1 id="heading">Sana küçük bir sürprizim var 🌸</h1>

 <p id="subtitle">Bakalım bu mektubu açabilecek misin?</p>

 <div class="arena" id="arena">
  <div class="envelope" id="envelope" onclick="clickEnvelope()">
   <div class="paper"></div>
  </div>
 </div>

 <button id="openBtn" onclick="clickEnvelope()">Mektuba tıkla 💌</button>

 <div id="message"></div>

 <button id="nextBtn" class="hidden" onclick="nextNote()">Devam et 🌷</button>

 <div id="catArea" class="hidden">
  <p>Şimdi seni mutlu edecek fotoğraflar için...</p>
  <div class="cat" onclick="showPhotos()">🐱</div>
  <p>Kediye tıkla! 🐾</p>
 </div>

 <div id="photos" class="hidden"></div>
 <div id="finish" class="hidden"></div>

</div>

<script>

const envelope=document.getElementById("envelope");
const message=document.getElementById("message");
const openBtn=document.getElementById("openBtn");
const nextBtn=document.getElementById("nextBtn");
const heading=document.getElementById("heading");
const subtitle=document.getElementById("subtitle");

let stage=0;
let busy=false;
let note=0;
let moveIndex=0;

const movements=[
 "shake-right",
 "shake-left",
 "shake-up",
 "shake-down"
];

const notes=[
"Umarım bugün yüzünde kocaman bir gülümseme vardır. Çünkü gülümsemek sana çok yakışıyordur. 🌸",
"Her gün mükemmel olmak zorunda değil. Bazen sadece günü atlatmak bile büyük başarıdır. 💗",
"Senin de kendine güzel davranmayı hak ettiğini unutma. Kendini ihmal etme. 🌷",
"Dünyada küçük şeylerden mutlu olabilen insanların yeri ayrıdır. Umarım hep öyle kalırsın. ✨",
"Kötü günlerin sonsuza kadar sürmeyeceğini unutma. Güzel günler de mutlaka gelecek. ☀️",
"Birinin gününü güzelleştirmek için bazen küçücük bir şey yeter. Bugün o küçük şey bu mektup olsun. 💌",
"Kendinle gurur duymak için büyük şeyler başarman gerekmiyor. Olduğun halinle de değerlisin. 🧸",
"Umarım karşına hep kalbini yormayan, sana iyi gelen insanlar çıkar. 💕",
"Hayatında bol bol kahkaha, güzel anılar ve tatlı sürprizler olsun. 🦋",
"Son not: İyi ki varsın. Umarım bu küçük sürpriz gününe biraz olsun güzellik katmıştır. ❤️"
];

function clickEnvelope(){

 if(busy || stage>=2)return;

 busy=true;

 openBtn.classList.add("hidden");

 // İlk dört tıklama: Mektup kaçar

 if(moveIndex<4){

  const names=[
   "Miyav! Sağ tarafa kaçtım! 🐱",
   "Miyav! Bu sefer sol tarafa! 😼",
   "Miyav! Yukarıdayım! 🙀",
   "Miyav! Aşağıya bak! 🐾"
  ];

  envelope.classList.remove(
   "shake-right",
   "shake-left",
   "shake-up",
   "shake-down",
   "open"
  );

  void envelope.offsetWidth;

  envelope.classList.add(movements[moveIndex]);

  message.innerHTML=
   "<div class='fade'><h2>"+names[moveIndex]+"</h2><p>Hadi, tekrar yakala bakalım!</p></div>";

  moveIndex++;

  setTimeout(()=>{
   busy=false;
  },1450);

  return;
 }

 // Beşinci tıklama: Mektup açılır

 envelope.classList.add("open");

 message.innerHTML="<div class='fade'><h2>Acaba sonunda yakaladın mı? 💌</h2></div>";

 setTimeout(()=>{

  if(stage===0){

   message.innerHTML=
   "<div class='fade'><h2>Bu kadar kolay mı bir mektubu açmak? 😼</h2><p>Hadi bakalım, bir tur daha!</p></div>";

   stage=1;
   moveIndex=0;

   nextBtn.classList.remove("hidden");
   nextBtn.innerText="Tekrar dene 💌";

  }else{

   stage=2;
   note=0;
   showNote();

  }

  busy=false;

 },1500);

}

function nextNote(){

 if(busy)return;

 if(stage===1){

  nextBtn.classList.add("hidden");

  heading.innerText="Bir dakika... 💗";
  subtitle.innerText="Bu sefer gerçekten açılacak mı?";

  message.innerHTML=
  "<div class='fade'><h2>Yakalamak o kadar kolay değil! 😹</h2><p>Hadi son bir kez dene!</p></div>";

  envelope.classList.remove(
   "shake-right",
   "shake-left",
   "shake-up",
   "shake-down",
   "open"
  );

  moveIndex=0;

  openBtn.classList.remove("hidden");

 }
}

function showNote(){

 heading.innerText="Senin için küçük bir not 💗";

 subtitle.innerText=(note+1)+" / 10";

 envelope.classList.add("hidden");

 message.innerHTML=
 "<div class='fade'><h2>"+notes[note]+"</h2></div>";

 nextBtn.classList.remove("hidden");

 nextBtn.innerText=
 note===9?"Son bir şey... ❤️":"Sonraki not 🌸";

 nextBtn.onclick=()=>{

  if(note<9){
   note++;
   showNote();
  }else{
   showFinish();
  }

 };

}

function showFinish(){

 nextBtn.classList.add("hidden");

 heading.innerText="Ve son olarak... 🌷";
 subtitle.innerText="";

 message.innerHTML=`
 <div class="fade">

 <h2>Buraya kadar geldiğin için teşekkürler! 🌷</h2>

 <p>
 Seni seven çok insan var.
 Senin varlığın birilerinin hayatında çok güzel bir yer kaplıyor.
 Bunu hiçbir zaman unutma.
 </p>

 <p>
 Umarım bu küçük sürpriz yüzünde bir gülümseme oluşturmuştur.
 Her şey gönlünce olsun. ❤️
 </p>

 <div class="cat">🐱💗🐾</div>

 <h2>İyi ki varsın! ❤️</h2>

 </div>
 `;

 petals();

}

function showPhotos(){
 document.getElementById("catArea").classList.add("hidden");
}

function petals(){

 const emojis=["🌸","💗","🐾","✨","🌷"];

 for(let i=0;i<35;i++){

  setTimeout(()=>{

   const el=document.createElement("div");

   el.className="floating";
   el.innerText=emojis[Math.floor(Math.random()*emojis.length)];

   el.style.left=Math.random()*100+"vw";
   el.style.animationDuration=(4+Math.random()*4)+"s";

   document.body.appendChild(el);

   setTimeout(()=>el.remove(),8500);

  },i*180);

 }

}

</script>

</body>
</html>
